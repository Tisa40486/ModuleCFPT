services: 

  front_net:
    build:
      context: "php-app"
      dockerfile: dockerfile

    ports: 
      - "8080:80"

    depends_on:
      - back_net

    environment : 
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

    networks:
      - back_net
      - front_net

  back_net: 

    build:
      context: "db"
      dockerfile: dockerfile

    environment: 
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

    volumes: 
        - ./php-app/src:/var/www/html

    networks:
      - back_net


networks:

  front_net:
    driver: bridge

  back_net:
    driver: bridge
    internal: true